name: Build FFmpegKit (iOS) - Export ZIP

on:
  workflow_dispatch:
    inputs:
      enable_simulator:
        description: 'Include iOS Simulator in XCFramework'
        type: boolean
        required: true
        default: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Source Code
        run: git clone --depth=1 --recurse https://github.com/arthenica/ffmpeg-kit-next ffmpeg

      - name: Install Build Tools & Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake nasm yasm meson ninja

      - name: Setup Permissions
        run: |
          cd ffmpeg
          chmod +x apple.sh
          find scripts -type f -name "*.sh" -exec chmod +x {} + 2>/dev/null || true

      - name: Build FFmpegKit for iOS
        run: |
          cd ffmpeg
          TARGETS="--ios"
          if [ "${{ github.event.inputs.enable_simulator }}" = "true" ]; then
            TARGETS="$TARGETS --ios-simulator"
          fi

          ./apple.sh \
            $TARGETS \
            --xcframework \
            --enable-gpl \
            --enable-https \
            --enable-dav1d \
            --enable-libvpx \
            --enable-opus \
            --enable-libx264 \
            --enable-lame \
            --enable-libass \
            --enable-freetype \
            --enable-fribidi \
            --enable-fontconfig

      - name: Compress XCFramework to ZIP
        run: |
          # ใช้แฟลก -y เพื่อรักษา Symbolic Links ใน Framework ให้สมบูรณ์
          zip -r -y ffmpegkit-ios-xcframework.zip bundle-apple-xcframework

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-ios-xcframework-zip
          path: ffmpegkit-ios-xcframework.zip
          retention-days: 7
