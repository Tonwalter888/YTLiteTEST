name: Build FFmpegKit (iOS)

on:
  workflow_dispatch:
    inputs:
      include_simulator:
        description: 'Include iOS Simulator (arm64-simulator & x86-64)'
        type: boolean
        required: true
        default: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Source Code
        run: git clone --depth=1 --recurse https://github.com/arthenica/ffmpeg-kit-next ffmpeg

      - name: Install Build Tools & Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config cmake nasm yasm meson ninja

      - name: Set Script Permissions
        run: |
          cd ffmpeg
          chmod +x nix-ios.sh
          find scripts -type f -name "*.sh" -exec chmod +x {} + 2>/dev/null || true

      - name: Execute ios.sh Build
        run: |
          cd ffmpeg
          curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install | sh
          # กำหนดสถาปัตยกรรมสำหรับเครื่องจริง (Device)
          ARCHS="--arm64"

          # เพิ่มสถาปัตยกรรม Simulator ตามเงื่อนไข
          if [ "${{ github.event.inputs.include_simulator }}" = "true" ]; then
            ARCHS="$ARCHS --arm64-simulator --x86-64"
          fi

          ./nix-ios.sh \
            $ARCHS \
            --xcframework \
            --enable-gpl \
            --enable-https \
            --enable-dav1d \
            --enable-libvpx \
            --enable-opus \
            --enable-libx264 \
            --enable-lame \
            --enable-libwebp \
            --enable-libass \
            --enable-freetype \
            --enable-fribidi \
            --enable-fontconfig

      - name: Compress XCFramework to ZIP
        run: |
          # ค้นหาโฟลเดอร์ bundle output แล้วบีบอัดเป็น .zip (รักษา symlink ด้วย -y)
          zip -r -y ffmpegkit-ios-xcframework.zip bundle-apple-*

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-ios-xcframework-zip
          path: ffmpegkit-ios-xcframework.zip
          retention-days: 7
