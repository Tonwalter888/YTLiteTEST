name: Build YouMod IPA with FLEX
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "IPA URL for newer than iOS 15"
        default: "https://decrypt.whoeevee.com/packages/mys0ezo5/com.google.ios.youtube-21.39.4.ipa"
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "WaterDev"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.waterdev.youtube"
        required: true
        type: string
        
      isios15:
        description: "Build for iOS 15?"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouMod IPA with FLEX
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,isios15
          
      - name: Install MEGA downloader
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        run: brew install megatools

      - name: Download IPA from Mega share link
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          megadl --no-progress --path youtube.ipa "$IPA_URL"

      - name: Download IPA from direct URL
        if: ${{ !startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          if [ !${{ inputs.isios15 }} ]; then
            wget "$IPA_URL" --quiet --no-verbose -O youtube.ipa
          else
            wget "https://archive.org/download/com.google.ios.youtube-20.21.6-Decrypted/com.google.ios.youtube-20.21.6-Decrypted.ipa" --quiet --no-verbose -O youtube.ipa
          fi

      - name: Validate IPA
        run: |
          file_type=$(file --mime-type -b youtube.ipa)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get YouTube Version 
        run: |
          unzip -q youtube.ipa -d ytextracted
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' ytextracted/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV

      - name: Install Dependencies
        run: brew install make ldid gnu-sed autoconf automake libtool pkg-config

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      # Original from YTweaks
      - name: Get tweaks commit
        run: |
          get_commit_hash() {
            local repo_url=$1
            git ls-remote "$repo_url" HEAD | awk '{print substr($1,1,7)}'
          }
          echo "THEOS_COMMIT=$(get_commit_hash "https://github.com/roothide/theos")" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: 26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
            git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
            git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
            cd iOS-SDKs
            git sparse-checkout set --no-cone iPhoneOS26.5.sdk
            git checkout --quiet
            mv *.sdk "$THEOS/sdks"
            
      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi
          
          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          else
            cd $THEOS/include/PSHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Install cyan
        run: pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Checkout YouMod
        uses: actions/checkout@v7
        with:
          repository: Tonwalter888/YouMod
          ref: pre-release
          path: YouMod

      - name: Clone things
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/UncappedAVPlayer
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay
          git clone --quiet --depth=1 https://github.com/Tonwalter888/YouGroupSettings
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTIcons
          git clone --quiet --depth=1 --recurse https://github.com/PoomSmart/FLEXing
          git clone --quiet --depth=1 https://github.com/Tonwalter888/YouNerdStats
          git clone --quiet --depth=1 https://github.com/Tonwalter888/FLEXHelperForYT

      - name: Restore FFmpegKit cache
        id: cache-ffmpegkit
        uses: actions/cache/restore@v6
        with:
          path: YouMod/modules/ffmpegkit
          key: ffmpegkit-${{ runner.os }}-${{ hashFiles('YouMod/tools/fetch-ffmpegkit.sh') }}

      - name: Build Things
        run: |
          cd YouMod
          echo "YOUMOD_VERSION=$(grep '^Version:' control | cut -d ' ' -f2)" >> $GITHUB_ENV
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youmod.deb
          cd ../UncappedAVPlayer
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/av.deb
          cd ../YTABConfig
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ab.deb
          cd ../FLEXing
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/flex.deb
          cd ../YTIcons
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/yticons.deb
          cd ../YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytvo.deb
          cd ../YouGroupSettings
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ygs.deb
          cd ../YouNerdStats
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/yns.deb
          cd ../FLEXHelperForYT
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/fhyt.deb

      - name: Save FFmpegKit cache
        if: ${{ steps.cache-ffmpegkit.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: YouMod/modules/ffmpegkit
          key: ${{ steps.cache-ffmpegkit.outputs.cache-primary-key }}
          
      - name: Inject Tweaks Into IPA
        run: |
          tweaks=""

          for f in *.deb; do
            tweaks="$tweaks $f"
          done
          
          cyan -i youtube.ipa -o WaterFLEX_${{ env.YT_VERSION }}_v${{ env.YOUMOD_VERSION }}.ipa -uwef $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Create a Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: waterflex-ipa${{ github.run_number }}
          name: WaterFLEX_${{ env.YT_VERSION }}_v${{ env.YOUMOD_VERSION }} (${{ github.run_number }}) 
          files: WaterFLEX_${{ env.YT_VERSION }}_v${{ env.YOUMOD_VERSION }}.ipa
          draft: true
