name: Build
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
    # Force Node.js 24 (Temporary fix for the Github Releases Node.js 20 warnings)
    # https://archive.org/download/com.google.ios.youtube-20.21.6-Decrypted/com.google.ios.youtube-20.21.6-Decrypted.ipa
    # git clone --quiet https://github.com/PoomSmart/IAmYouTube.git
    # git clone --quiet https://github.com/PoomSmart/YouTube-X.git
    # git clone --quiet https://github.com/PoomSmart/YTVideoOverlay.git
    # git clone --quiet https://github.com/Tonwalter888/YouMute.git
    # git clone --quiet https://github.com/Tonwalter888/YTMusicUltimate.git
    # https://decrypt.download/api/downloads/fe5e4b75-2754-4265-936f-f150a7bdbcc3
    # wget "https://archive.org/download/com.google.ios.youtube-21.07.4-Decrypted/com.google.ios.youtube-21.07.4-Decrypted.ipa" --no-verbose --quiet -O youtube.ipa

    steps:
      - name: Clone
        run: |
          git clone --quiet https://github.com/PoomSmart/IAmYouTube.git
          git clone --quiet https://github.com/PoomSmart/YouTube-X.git
          wget "https://decrypt.download/api/downloads/8bcade17-bbed-4fdb-bde9-8d4e6c582e88" --no-verbose --quiet -O youtube.ipa

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environments variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV 

      - name: Clone Theos
        run: git clone --quiet --recurse-submodules https://github.com/theos/theos.git

      - name: Download iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Clone YouTubeHeader
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git $THEOS/include/YouTubeHeader
          
      - name: Clone PSHeader
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git $THEOS/include/PSHeader
        
        # git switch feat/audioquality
      - name: Build
        run: |
          cd IAmYouTube
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/imyt.deb
          cd ..
          cd YouTube-X
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytx.deb

      - name: Inject Tweaks Into IPA
        run: |
          tweaks=""
          
          for f in *.deb; do
            if [ -f "$f" ]; then
              tweaks="$tweaks $f"
            fi
          done
          
          cyan -i youtube.ipa -o WaterTest.ipa -uwef $tweaks -n "WaterTest" -b com.waterdev.youtube
          
      - name: Create a Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watertest-ipa${{ github.run_number }}
          name: WaterTest (${{ github.run_number }}) 
          files: WaterTest.ipa
          draft: true
