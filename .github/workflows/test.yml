name: Build
on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        type: choice
        options:
          - 16.5
          - 17.5
          - 18.6
        required: true
        default: 18.6

      url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
    ## Force Node.js 24 (Temporary fix for the Github Releases Node.js 20 warnings)
    # env:
    #   ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Clone
        run: |
          git clone --quiet https://github.com/Tonwalter888/YTMusicUltimatePlus.git
          wget "${{ inputs.url }}" -O youtube.ipa

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environments variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV 

      - name: Setup Theos
        run: git clone --quiet --recurse-submodules https://github.com/theos/theos.git

      - name: Download iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Clone YouTubeHeader
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git $THEOS/include/YouTubeHeader
          
      #- name: Clone PSHeader
      #  run: git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git $THEOS/include/PSHeader

      - name: Build
        run: |
          cd YTMusicUltimatePlus
          git switch updatetweak
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOADING=1
          mv packages/*.deb ${{ github.workspace }}/ytmult.deb

      - name: Inject Tweaks Into IPA
        run: |
          tweaks=""
          
          for f in *.deb; do
            if [ -f "$f" ]; then
              tweaks="$tweaks $f"
            fi
          done
          
          cyan -i youtube.ipa -o WaterTest.ipa -uwef $tweaks -n "WaterTest" -b com.waterdev.youtube
          
      - name: Create a Draft Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: watertest-ipa${{ github.run_number }}
          name: WaterTest (${{ github.run_number }}) 
          files: WaterTest.ipa
          draft: true
